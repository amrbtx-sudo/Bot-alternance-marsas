name: Offres alternance quotidiennes

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Recherche et envoi Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python Bot.py

      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "alternance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.db
          git diff --cached --quiet || git commit -m "update seen offers"
          git push
